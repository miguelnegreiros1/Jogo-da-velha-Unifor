    <main class="game-container">
        <section id="menuScreen" class="screen card">
            <h1>Jogo da Velha</h1>
            <h2>UNIVERSIDADE DE FORTALEZA</h2>
            
            <div class="menu-group">
                <label>1. Escolha o Modo de Jogo:</label>
                <div class="options">
                    <button class="btn btn-option" data-type="mode" data-value="pvp">Jogador vs Jogador</button>
                    <button class="btn btn-option" data-type="mode" data-value="pve">Jogador vs IA</button>
                </div>
            </div>

            <div id="difficultyGroup" class="menu-group hidden">
                <label>2. Dificuldade da IA:</label>
                <div class="options">
                    <button class="btn btn-option" data-type="difficulty" data-value="easy">Fácil</button>
                    <button class="btn btn-option" data-type="difficulty" data-value="medium">Médio</button>
                    <button class="btn btn-option" data-type="difficulty" data-value="hard">Impossível</button>
                </div>
            </div>

            <div id="bestOfGroup" class="menu-group hidden">
                <label id="bestOfLabel">2. Formato da Partida:</label>
                <div class="options">
                    <button class="btn btn-option" data-type="bestOf" data-value="1">Jogo Único</button>
                    <button class="btn btn-option" data-type="bestOf" data-value="3">Melhor de 3</button>
                    <button class="btn btn-option" data-type="bestOf" data-value="5">Melhor de 5</button>
                </div>
            </div>

            <button id="startGameBtn" class="btn btn-primary btn-large" disabled>Iniciar Jogo</button>
        </section>

        <section id="gameScreen" class="screen hidden">
            <header class="header-container">
                <h1>Jogo da Velha</h1>
                <h2>UNIVERSIDADE DE FORTALEZA</h2>
                
                <div class="scoreboard">
                    <div class="score-box"><span id="playerXName">Jogador X</span>: <span id="scoreX">0</span></div>
                    <div class="score-box">Empates: <span id="scoreDraws">0</span></div>
                    <div class="score-box"><span id="playerOName">Jogador O</span>: <span id="scoreO">0</span></div>
                </div>

                <div class="status-container">
                    <div id="status" class="status-message">Vez do jogador: X</div>
                </div>
            </header>

            <div id="board" class="board" aria-label="Tabuleiro do Jogo da Velha"></div>

            <footer>
                <button id="restartRoundBtn" class="btn">Reiniciar Rodada</button>
                <button id="backToMenuBtn" class="btn btn-secondary">Voltar ao Menu</button>
            </footer>
        </section>
    </main>
